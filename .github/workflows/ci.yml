name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build
        run: npm run build

  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        working-directory: engine
        run: npm ci

      - name: Typecheck and build
        working-directory: engine
        run: npm run build

  docker:
    needs: [web, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine whether to publish
        id: publish
        run: |
          echo "should=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.should == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish) web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.publish.outputs.should == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/chessteacher-web:latest
            ghcr.io/${{ github.repository_owner }}/chessteacher-web:sha-${{ steps.publish.outputs.short_sha }}

      - name: Build (and publish) engine image
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          push: ${{ steps.publish.outputs.should == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/chessteacher-engine:latest
            ghcr.io/${{ github.repository_owner }}/chessteacher-engine:sha-${{ steps.publish.outputs.short_sha }}
