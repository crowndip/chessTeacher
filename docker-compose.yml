services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENGINE_URL=http://engine:4000
    ports:
      - "9999:3000"
    depends_on:
      - engine

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
